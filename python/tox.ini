[tox]
envlist = py{38,39,310,311,312}, coverage, docs, benchmark
skipsdist = False

[testenv]
deps =
    -r requirements.txt
    -r requirements-dev.txt
commands =
    pytest tests/ -v --cov=analogtivation --cov-append

[testenv:coverage]
deps =
    coverage[toml]
    -r requirements.txt
    -r requirements-dev.txt
commands =
    coverage erase
    pytest tests/ --cov=analogtivation --cov-report=term-missing --cov-report=html --cov-report=xml
    coverage report --fail-under=80

[testenv:docs]
deps =
    sphinx>=4.0
    sphinx-rtd-theme
    nbsphinx
changedir = ../docs
commands =
    sphinx-build -W -b html -d {envtmpdir}/doctrees . {envtmpdir}/html

[testenv:benchmark]
deps =
    -r requirements.txt
    -r requirements-dev.txt
    pytest-benchmark
commands =
    pytest benchmarks/ -v --benchmark-only

[testenv:lint]
deps =
    black
    isort
    flake8
    mypy
commands =
    black --check analogtivation tests
    isort --check-only analogtivation tests
    flake8 analogtivation tests
    mypy analogtivation

[testenv:format]
deps =
    black
    isort
commands =
    black analogtivation tests
    isort analogtivation tests

[testenv:type]
deps =
    mypy
    -r requirements.txt
commands =
    mypy analogtivation --ignore-missing-imports --strict

[testenv:integration]
deps =
    -r requirements.txt
    -r requirements-dev.txt
    tensorflow>=2.0
    torch>=1.0
    jax[cpu]
commands =
    pytest tests/test_integration*.py tests/test_cross_framework.py -v
