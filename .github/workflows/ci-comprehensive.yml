name: Comprehensive CI

on:
  push:
    branches: [ main, develop, 'feature/*' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  python-unit-tests:
    name: Python Tests (${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']
        exclude:
          # Python 3.8 has some compatibility issues on newer OS
          - os: macos-latest
            python-version: '3.8'
          - os: windows-latest
            python-version: '3.8'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/pip
          ~/Library/Caches/pip
          ~\AppData\Local\pip\Cache
        key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements*.txt', '**/setup.py') }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ matrix.python-version }}-
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        cd python
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        pip install -e .

    - name: Lint with flake8
      if: matrix.os == 'ubuntu-latest'
      run: |
        cd python
        flake8 analogtivation tests --count --statistics --max-line-length=88 --extend-ignore=E203,W503

    - name: Type check with mypy
      if: matrix.os == 'ubuntu-latest' && matrix.python-version != '3.8'
      run: |
        cd python
        mypy analogtivation --ignore-missing-imports

    - name: Run unit tests
      run: |
        cd python
        pytest tests/test_core*.py tests/test_utils.py -v --cov=analogtivation --cov-report=xml --cov-report=term-missing

    - name: Upload coverage
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      uses: codecov/codecov-action@v4
      with:
        file: ./python/coverage.xml
        flags: unittests
        name: unit-tests

  python-framework-tests:
    name: Framework Tests (${{ matrix.framework }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        framework: [tensorflow, torch, jax]
        python-version: ['3.9', '3.11']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ matrix.framework }}-${{ matrix.python-version }}-${{ hashFiles('**/requirements*.txt', '**/setup.py') }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ matrix.framework }}-${{ matrix.python-version }}-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        cd python
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        pip install -e .
        pip install -e .[${{ matrix.framework }}]

    - name: Run framework-specific tests
      run: |
        cd python
        pytest tests/test_${{ matrix.framework }}*.py tests/test_cross_framework.py -v -k ${{ matrix.framework }}

    - name: Run consistency tests
      run: |
        cd python
        pytest tests/test_cross_framework.py -v

  python-integration-tests:
    name: Integration Tests
    needs: [python-unit-tests]
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install all frameworks
      run: |
        python -m pip install --upgrade pip setuptools wheel
        cd python
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        pip install -e .[tensorflow,torch,jax]

    - name: Run integration tests
      run: |
        cd python
        pytest tests/test_integration*.py -v --cov=analogtivation --cov-report=xml

    - name: Upload integration coverage
      uses: codecov/codecov-action@v4
      with:
        file: ./python/coverage.xml
        flags: integration
        name: integration-tests

  python-benchmarks:
    name: Performance Benchmarks
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        cd python
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        pip install -e .[tensorflow,torch,jax]
        pip install pytest-benchmark

    - name: Run benchmarks
      run: |
        cd python
        pytest benchmarks/ -v --benchmark-only --benchmark-json=benchmark.json

    - name: Store benchmark result
      uses: benchmark-action/github-action-benchmark@v1
      with:
        tool: 'pytest'
        output-file-path: python/benchmark.json
        github-token: ${{ secrets.GITHUB_TOKEN }}
        auto-push: false

  r-tests:
    name: R Tests (${{ matrix.r-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        r-version: ['4.1', '4.2', '4.3', '4.4']

    steps:
    - uses: actions/checkout@v4

    - name: Set up R ${{ matrix.r-version }}
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: ${{ matrix.r-version }}
        use-public-rspm: true

    - name: Install system dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libcurl4-openssl-dev

    - name: Install R dependencies
      uses: r-lib/actions/setup-r-dependencies@v2
      with:
        cache-version: 2
        extra-packages: |
          any::rcmdcheck
          any::covr

    - name: Check R package
      uses: r-lib/actions/check-r-package@v2
      with:
        args: 'c("--no-manual", "--as-cran")'
        error-on: '"error"'

    - name: Test coverage
      if: matrix.os == 'ubuntu-latest' && matrix.r-version == '4.3'
      run: |
        covr::codecov(quiet = FALSE)
      shell: Rscript {0}

  docs-build:
    name: Documentation Build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        cd python
        pip install -r requirements.txt
        pip install -e .[docs]

    - name: Build documentation
      run: |
        cd docs
        make html

    - name: Check documentation links
      run: |
        cd docs
        make linkcheck
